# ========================
# MySQL DataSource Config
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/paydost_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# JPA / Hibernate Config
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================
# Server Config
# ========================
server.port=8080

# ========================
# JWT Config
# ========================
app.jwt.secret=${JWT_SECRET:c2VjdXJlLXJhbmRvbS1rZXktZm9yLXBheWRvc3QtYXBwLWNoYW5nZS1pbi1wcm9k}
app.jwt.expiration=86400000
